<!DOCTYPE html>
<!-- 增加沙箱脚本权限允许 -->
<html lang="en-us" sandbox="allow-scripts allow-same-origin allow-forms">
<head>
    <meta charset="utf-8">
    <title>Gem Sorting Puzzle</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100vh; overflow:hidden; background:#231F20; }
        #unity-canvas { position:fixed; top:0; left:0; width:100%; height:100%; background:#231F20; }
        /* 广告容器固定渲染，隐藏不遮挡游戏 */
        #applixir-app { position:absolute; width:1px; height:1px; left:-9999px; top:-9999px; display:block; }
    </style>

    <!-- TG -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- AdsGram官方SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <!-- 容器前置渲染，杜绝null报错 -->
    <div id="applixir-app"></div>

    <script src="Build/webgl.loader.js"></script>
    <script>
        window.unityInstance = null;
        window.applixirReady = false;

        // TG基础初始化
        function initTG() {
            if(window.Telegram?.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }
        }

        // 延后初始化广告，等Unity基础启动完毕
        function lazyInitApplixir(){
            setTimeout(()=>{
                try{
                    const app = new Application({
                        injectionElementId: "applixir-app",
                        apiKey: "78b0120c-0022-4176-80c2-7ab200c0c9e0",
                        adStatusCallbackFn: (status)=>{
                            window.adStatusCallbackX?.call(null, status);
                        },
                        adErrorCallbackFn: (err)=>{
                            window.adErrorCallbackX?.call(null, err?.toString()||"");
                        }
                    });
                    app.initialize().then(()=>{
                        window.ApplixirApp = app;
                        window.applixirReady = true;
                        console.log("Applixir 完全就绪，可调用广告");
                    });
                }catch(e){
                    console.error("广告初始化异常",e);
                }
            }, 1200);
        }

        // 页面全部加载完成再启动Unity
        window.onload = function(){
            initTG();
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/webgl.data",
                frameworkUrl: "Build/webgl.framework.js",
                codeUrl: "Build/webgl.wasm",
                symbolsUrl: "Build/webgl.symbols.json",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "FoxGames",
                productName: "Gem Sorting Puzzle",
                productVersion: "0.0.1",
            }).then(ins=>{
                window.unityInstance = ins;
                // Unity启动后再初始化广告
                lazyInitApplixir();
            });
        }
    </script>

    <!-- 广告SDK延后加载 -->
    <script src="https://cdn.applixir.com/applixir.app.v6.0.1.js" defer></script>
</body>
</html>
