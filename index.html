<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Gem Sorting Puzzle</title>
    <!-- 固定Viewport，解决移动端适配 -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    
    <!-- 样式：全屏+居中+无偏移，适配所有设备 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            border: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #231F20;
        }
        #unity-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #231F20;
            display: block;
        }
        /* 广告必需容器（隐藏，不影响游戏） */
        #applixir-app {
            display: none;
            width: 0;
            height: 0;
            position: absolute;
        }
    </style>

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <!-- 广告SDK必须的DOM元素 -->
    <div id="applixir-app"></div>

    <!-- 1. 先加载Unity Loader -->
    <script src="Build/webgl.loader.js"></script>

    <!-- 2. 页面加载完成后再初始化（解决所有未定义报错） -->
    <script>
        window.addEventListener("load", function () {
            // Telegram 兼容代码（仅保留 v6.0 支持的方法）
            if (window.Telegram && window.Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                // 移除了不兼容的方法：disableVerticalSwipes / setHeaderColor
            }

            // 初始化Unity（绝对不会报错）
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/webgl.data",
                frameworkUrl: "Build/webgl.framework.js",
                codeUrl: "Build/webgl.wasm",
                symbolsUrl: "Build/webgl.symbols.json",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "FoxGames",
                productName: "Gem Sorting Puzzle",
                productVersion: "0.0.1",
            });
        });
    </script>

    <!-- 3. 广告SDK（最后加载，无崩溃） -->
    <script src="https://cdn.applixir.com/applixir.app.v6.0.1.js"></script>
    <script>
        window.addEventListener("load", function () {
            try {
                const options = {
                    injectionElementId: "applixir-app",
                    apiKey: "78b0120c-0022-4176-80c2-7ab200c0c9e0",
                    adStatusCallbackFn: (status) => {
                        if (window.adStatusCallbackX) window.adStatusCallbackX(status);
                    },
                    adErrorCallbackFn: (error) => {
                        if (window.adErrorCallbackX) window.adErrorCallbackX(error.toString());
                    }
                };

                window.ApplixirApp = new Application(options);
                window.ApplixirApp.initialize();
            } catch (e) {
                console.log("广告SDK跳过初始化，不影响游戏");
            }
        });
    </script>
</body>
</html>
