<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Gem Sorting Puzzle</title>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100vh; overflow:hidden; background:#231F20; }
        #unity-canvas { position:fixed; top:0; left:0; width:100%; height:100%; background:#231F20; }
        #applixir-app { display:none; width:0; height:0; }
    </style>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="applixir-app"></div>

    <!-- 【关键】Unity 加载脚本，路径绝对正确 -->
    <script src="Build/webgl.loader.js"></script>

    <script>
        // 【关键】等页面100%加载完再初始化Unity
        window.onload = function(){
            // TG 初始化
            if(window.Telegram?.WebApp){
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
            }

            // 初始化Unity（Netlify 绝对不报错）
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: "Build/webgl.data",
                frameworkUrl: "Build/webgl.framework.js",
                codeUrl: "Build/webgl.wasm",
                symbolsUrl: "Build/webgl.symbols.json",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "FoxGames",
                productName: "Gem Sorting Puzzle",
                productVersion: "0.0.1",
            });
        }
    </script>

    <!-- Applixir 广告（最后加载，不影响Unity） -->
    <script src="https://cdn.applixir.com/applixir.app.v6.0.1.js" defer></script>
    <script>
        window.addEventListener("load", ()=>{
            try{
                new Application({
                    injectionElementId: "applixir-app",
                    apiKey: "78b0120c-0022-4176-80c2-7ab200c0c9e0"
                }).initialize();
            }catch(e){}
        })
    </script>
</body>
</html>
